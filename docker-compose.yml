services:
  postgres:
    image: postgres:16-alpine
    profiles: ["local-db"]
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: maddox_quant
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    restart: unless-stopped
    ports:
      - "8765:8765"
    env_file: .env
    environment:
      CORS_ORIGINS: http://localhost:4321,https://maddox-quant.vercel.app
      STORAGE_PATH: /app/storage/reports
    volumes:
      - ./storage:/app/storage
      - ./backend:/app

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8765
        INTERNAL_API_URL: http://backend:8765
    restart: unless-stopped
    ports:
      - "4321:4321"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8765
      INTERNAL_API_URL: http://backend:8765
    depends_on:
      - backend

volumes:
  pgdata:
